<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Accra Life: a 3D life simulation set in Accra, Ghana." />
    <title>Accra Life</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14110e; overflow: hidden; }
      #game-root { position: fixed; inset: 0; }
      #game-root canvas { display: block; width: 100%; height: 100%; }
      #boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #14110e; color: #f4efe6; font-family: system-ui, sans-serif; transition: opacity .5s; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; font-size: 40px; letter-spacing: 1px; }
      #boot .bar { width: min(320px, 80vw); height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; }
      #boot .fill { height: 100%; width: 0; background: #c8402f; transition: width .2s; }
      #boot .label, #boot .err { font-size: 13px; opacity: .75; text-align: center; max-width: 80vw; }
      #boot .err { color: #ff9c8a; opacity: 1; }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="ui-root"></div>
    <div id="boot">
      <h1>Accra Life</h1>
      <div class="bar"><div class="fill" id="boot-fill"></div></div>
      <div class="label" id="boot-label">Loading...</div>
      <noscript>Accra Life needs JavaScript.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
